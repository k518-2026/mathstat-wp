name: Bluesky で告知

# WordPress に送った記事が RSS に出ていれば Bluesky で告知する。
# 投稿の直後（publish.yml）に出ていなかった記事を、1・2時間後に拾い直すためのもの。

on:
  # schedule:  # 2026-10-05 WordPress 異議申し立ての結果待ちのため一時停止。再開は # を外す
    # - cron: '0 21,22,3 * * *'   # 毎日 06:00・07:00・12:00 (Asia/Tokyo)。5:00 の投稿の1・2時間後と、昼の拾い直し
  workflow_dispatch:
    inputs:
      dry_run:
        description: '投稿せずに、告知文をログに出すだけ'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: mathstat-wp
  cancel-in-progress: false

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 告知する
        env:
          WP_SITE_URL: ${{ secrets.WP_SITE_URL }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_PASSWORD: ${{ secrets.BLUESKY_PASSWORD }}
        run: node announce.js ${{ inputs.dry_run && '--dry' || '' }}

      - name: 記録を保存する
        if: ${{ always() && !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/posted.json
          git diff --cached --quiet || git commit -m "Announced on Bluesky"
          git pull --rebase
          git push
